name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check whether the package version is already published
        id: package-version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if npm view "gw-store@${package_version}" version --json > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "gw-store@${package_version} is already published; skipping publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      # prepublishOnly runs the full check and prepack builds the package.
      - run: npm publish --access public --provenance
        if: steps.package-version.outputs.publish == 'true'
        env:
          # Keep this token as a fallback until npm trusted publishing is enabled.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
