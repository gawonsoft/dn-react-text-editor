name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run test:package
      - run: npm pack --dry-run

  react-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - react-version: 18.3.1
            react-types-version: 18.3.1
          - react-version: 19.2.8
            react-types-version: 19.2.14
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Select React version
        run: >-
          npm install --no-save --ignore-scripts
          react@${{ matrix.react-version }}
          react-dom@${{ matrix.react-version }}
          @types/react@${{ matrix.react-types-version }}
      - run: npm run check
